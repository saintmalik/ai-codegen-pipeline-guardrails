# Semgrep rules for AI-generated PRs (Devfest Ado Ekiti 2026 demo).
# Catches common "helpful" agent anti-patterns in the bad fixture.

rules:
  - id: ai-codegen.python-eval
    message: "Avoid eval() in agent-proposed code; use an explicit handler map."
    languages: [python]
    severity: ERROR
    patterns:
      - pattern: eval(...)

  - id: ai-codegen.subprocess-shell
    message: "subprocess with shell=True is blocked for AI-generated PRs."
    languages: [python]
    severity: ERROR
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: ai-codegen.os-system
    message: "os.system is blocked for AI-generated PRs."
    languages: [python]
    severity: ERROR
    patterns:
      - pattern: os.system(...)
